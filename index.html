<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#f7f7f4">

  <title>U22 Homework</title>

  <link rel="stylesheet" href="./style.css?v=2">
</head>

<body>

  <div class="page">

    <header class="topbar">
      <div class="identity">
        <div class="identity-mark"></div>
        <span>U22</span>
      </div>

      <div class="internal-badge">
        Interno
      </div>
    </header>

    <main>

      <section class="hero">
        <div class="eyebrow">
          U22 HOMEWORK
        </div>

        <h1>
          Compiti,<br>
          senza complicazioni.
        </h1>

        <p>
          Visualizza i compiti da oggi in poi,
          oppure scegli un giorno e una materia.
        </p>
      </section>


      <section class="filters">

        <div class="filter-block">

          <div class="filter-label">
            Materia
          </div>

          <div class="custom-select" id="subject-select">

            <button
              class="select-trigger"
              id="subject-trigger"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span id="subject-value">
                Tutte le materie
              </span>

              <svg
                class="chevron"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <path
                  d="M5 7.5 10 12.5 15 7.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <div
              class="select-menu"
              id="subject-menu"
              role="listbox"
              hidden
            ></div>

          </div>

        </div>


        <div class="date-section">

          <div class="date-topline">
            <div>
              <div class="filter-label">
                Data
              </div>

              <div
                class="month-title"
                id="month-title"
              >
                —
              </div>
            </div>

            <div class="date-nav">
              <button
                class="round-button"
                id="date-prev"
                type="button"
                aria-label="Giorni precedenti"
              >
                <svg viewBox="0 0 20 20">
                  <path
                    d="M12 5 7 10l5 5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>

              <button
                class="round-button"
                id="date-next"
                type="button"
                aria-label="Giorni successivi"
              >
                <svg viewBox="0 0 20 20">
                  <path
                    d="m8 5 5 5-5 5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div
            class="date-strip"
            id="date-strip"
          ></div>

        </div>


        <div class="filter-footer">

          <button
            class="reset-button"
            id="reset-filters"
            type="button"
          >
            Ripristina
          </button>

          <div
            class="view-caption"
            id="view-caption"
          >
            Da oggi in poi
          </div>

        </div>

      </section>


      <section class="content-head">
        <div id="result-count">
          0 compiti
        </div>

        <div id="updated-label">
          Nessun compito pubblicato
        </div>
      </section>


      <section
        id="homework-list"
        class="homework-list"
      ></section>


      <section
        id="empty-state"
        class="empty-state"
      >
        <div class="empty-symbol">
          —
        </div>

        <h2>
          Nessun compito
        </h2>

        <p>
          Al momento non ci sono compiti pubblicati.
        </p>
      </section>

    </main>

  </div>


  <script>
    const bust = Date.now();

    document.write(
      `<script src="./homework.js?v=${bust}"><\/script>`
    );

    document.write(
      `<script src="./app.js?v=${bust}"><\/script>`
    );
  </script>

</body>
</html>
